name: Problem
description: Something in WearMesh went wrong or did not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing WearMesh. Settings › About WearMesh shows the version, radio model
        and firmware. [docs/TESTING.md](https://github.com/Colorado-Mesh/wearmesh/blob/main/docs/TESTING.md)
        says how to get the log.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Roughly when, if you know.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WearMesh version
      placeholder: 0.1.0 (26)
    validations:
      required: true
  - type: input
    id: watch
    attributes:
      label: Watch and Wear OS version
      placeholder: Pixel Watch 5, Wear OS 6
    validations:
      required: true
  - type: input
    id: radio
    attributes:
      label: Radio and firmware
      placeholder: Heltec Mesh Node T1, MeshCore companion 1.x (stock) or zephcore 1.x
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Live
        - Check-in (15 min)
        - Check-in (30 min)
        - Check-in (60 min)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Settings › Diagnostics › Save log, then `adb pull /sdcard/Download/WearMesh/`. Drag the file here.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before attaching the log
      options:
        - label: Message text in log was off (the default), or I am happy to share the text it holds
