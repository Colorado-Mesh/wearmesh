# CodeRabbit review settings for WearMesh.
# Reference: https://docs.coderabbit.ai/reference/configuration
#
# Modelled on MeshCore TAK Bridge's settings. Reviews should catch what would hurt people using
# the watch in the field: writes to the radio, Bluetooth steps that can hang, a foreground service
# that dies or drains the battery, lost or duplicated messages, and protocol changes that drift
# from the bridge's copy. Style is left alone; the project has no formatter or linter for it.

language: en-GB # Match MeshCore TAK Bridge's docs and app text.
tone_instructions: >-
  Be brief and concrete. Flag real defects and risks, with the failing case. Skip style, naming
  and refactoring suggestions unless they hide a bug. Write in plain British English.
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false

  path_filters:
    - "!**/build/**"
    - "!.gradle/**"
    - "!gradle/wrapper/gradle-wrapper.jar"
    # Written by docs/icon/make_icon.py; review the script, not its output.
    - "!docs/icon/*.png"
    - "!docs/icon/icon.svg"
    - "!wear/src/main/res/drawable/ic_*.xml"
    - "!wear/src/main/res/mipmap-anydpi-v26/*.xml"
    # Written by Room during the build; review the entities and DAO instead.
    - "!wear/schemas/**"

  path_instructions:
    - path: "**"
      instructions: |
        A standalone Wear OS app (no phone needed) that connects straight to a MeshCore
        companion radio over Bluetooth LE for channel and direct messages. The first target is
        the Pixel Watch 5. Design rules, from docs/design.md; flag any change that breaks one:
        - The watch is the radio's only client while connected; no multi-client handling.
        - Never write to the radio's configuration: no channels, contacts, settings, advertised
          position, paths or keys. Sending text is allowed. Setting the radio's clock is planned
          (design.md) and needs to be deliberate, not a side effect.
        - One Bluetooth operation at a time, and every operation has a time limit.
        - Use every channel the radio reports, not a fixed number of slots.
        - Channel secrets never leave the radio frames they arrive in; the watch stores names
          and indexes only.
        - Nothing leaves the watch: no network calls, no telemetry, no cloud sync.
        - Battery matters: flag polling, wake-ups or work in the service that could be event
          driven, and anything that keeps the radio link or the screen on longer than needed.
        Focus on correctness, thread safety, resource leaks and lost or duplicated messages.
        When a pull request changes behaviour, check that docs/design.md, docs/M0-spike.md and
        the README are updated to match.

    - path: "meshcore-kotlin"
      instructions: |
        A git submodule: the MeshCore protocol and Bluetooth link, shared with MeshCore TAK
        Bridge and reviewed in Colorado-Mesh/meshcore-kotlin. Here only its pinned commit
        changes. Check that a pull request moving it says what changed there and why WearMesh
        needs it, and that the watch's use of any changed API (RadioSession, CompanionClient)
        still fits.

    - path: "wear/src/main/**"
      instructions: |
        The Wear OS app: minSdk 33 (Wear OS 4), targetSdk 34, Compose for Wear OS. The radio link
        lives in a foreground service of type connectedDevice so it survives the screen going
        off; check that it is started only with Bluetooth permission granted, always calls
        startForeground with that type, stops cleanly, and does not leak handlers or threads.
        Callbacks from the link and protocol threads must reach service state through the main
        thread or a thread-safe holder; Compose reads state only from flows. Flag work that
        blocks a listener callback (the protocol client holds its lock while calling them).
        Layouts must suit a small round screen and one-handed use.

    - path: "wear/src/main/kotlin/org/coloradomesh/wearmesh/data/**"
      instructions: |
        The message store (Room) and the radio sync step shared by Check-in and Live. Decided
        for M2: one history for one radio (syncing with another radio clears the store),
        forgetting a radio deletes its messages, the newest 100 messages per conversation by
        arrival order, and a message with the same conversation, sender, sent time and text is
        stored once. Channel keys are never stored. Storage calls run on Storage.writer, one at
        a time; flag any that run on the main thread or inside a protocol listener call. A
        change to an entity needs a schema version bump.

    - path: "wear/src/main/kotlin/org/coloradomesh/wearmesh/ui/**"
      instructions: |
        The screens, Compose for Wear OS. Decided for M2 step 3: Home lists direct messages
        first (newest first), then every programmed channel in slot order; Check now is a brief
        read; times shown are when the watch received a message, not the sender's clock. Check
        that lists suit a small round screen (ScalingLazyColumn, short single-line labels,
        swipe to go back), that nothing on screen blocks on storage (reads are Room Flows,
        writes go through Storage), and that pure logic (HomeRows, TimeAgo, Mentions) keeps
        its JVM tests in step with changes.

    - path: "docs/icon/make_icon.py"
      instructions: |
        Writes the app's icon drawables, launcher icons, docs/icon/icon.svg and the PNGs. If
        this script changes, the generated files should change with it in the same pull request.
        Everything must stay within a radius of 33 of the centre of the 108 grid, since a watch
        launcher shows the icon as a circle.

    - path: ".github/workflows/**"
      instructions: |
        CI builds every pull request and CodeQL analyses the Kotlin with a manual build. Every
        action except github/codeql-action must be pinned to a full commit SHA with its version
        in a comment. Permissions stay least-privilege. Values from the event (branch names,
        titles) reach shell scripts only through env, never as ${{ }} inside run blocks.

    - path: "docs/**"
      instructions: |
        design.md (the plan and its decisions) and M0-spike.md (the Bluetooth test procedure)
        must match the code. Check that statements about behaviour, limits and numbers are true
        of the code in this pull request, and that results are only claimed as "seen on a watch"
        when they were.

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true

  tools:
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    shellcheck:
      enabled: true
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    # Off: style linters with no project configuration would mostly add noise.
    detekt:
      enabled: false
    yamllint:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  linked_repositories:
    - repository: "Colorado-Mesh/meshcore-kotlin"
      instructions: >-
        The shared protocol and Bluetooth code, included here as a submodule. Its README says
        how the apps use it.
    - repository: "Colorado-Mesh/meshcore-tak-bridge"
      instructions: >-
        The phone app that shares meshcore-kotlin with WearMesh. What it learned about radios
        and Android Bluetooth is in its docs/DESIGN.md and docs/STATUS.md.
